name: CMake on multiple platforms

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.os }} / C++${{ matrix.cxx_standard }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cxx_standard: [11, 14, 17, 20]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build-${{ matrix.cxx_standard }}/_deps
          key: cmake-deps-${{ runner.os }}-cxx${{ matrix.cxx_standard }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-${{ runner.os }}-cxx${{ matrix.cxx_standard }}-
            cmake-deps-${{ runner.os }}-

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build-${{ matrix.cxx_standard }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCLASSIFY_SCALAR_BUILD_TESTS=ON
          -DCLASSIFY_SCALAR_BUILD_CATCH2_TESTS=${{ matrix.cxx_standard == 11 && 'OFF' || 'ON' }}
          -DCLASSIFY_SCALAR_TEST_CXX_STANDARD=${{ matrix.cxx_standard }}

      - name: Build
        run: cmake --build build-${{ matrix.cxx_standard }} --config ${{ env.BUILD_TYPE }} --parallel

      - name: Test
        run: ctest --test-dir build-${{ matrix.cxx_standard }} --build-config ${{ env.BUILD_TYPE }} --output-on-failure
  asan:
    name: ASan / Ubuntu / C++${{ matrix.cxx_standard }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        cxx_standard: [11, 14, 17]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build-asan-${{ matrix.cxx_standard }}/_deps
          key: cmake-deps-asan-${{ runner.os }}-cxx${{ matrix.cxx_standard }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-asan-${{ runner.os }}-cxx${{ matrix.cxx_standard }}-
            cmake-deps-${{ runner.os }}-cxx${{ matrix.cxx_standard }}-
            cmake-deps-${{ runner.os }}-

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build-asan-${{ matrix.cxx_standard }}
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          -DCLASSIFY_SCALAR_BUILD_TESTS=ON
          -DCLASSIFY_SCALAR_BUILD_CATCH2_TESTS=${{ matrix.cxx_standard == 11 && 'OFF' || 'ON' }}
          -DCLASSIFY_SCALAR_TEST_CXX_STANDARD=${{ matrix.cxx_standard }}

      - name: Build
        run: cmake --build build-asan-${{ matrix.cxx_standard }} --config RelWithDebInfo --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_init_order=1
        run: ctest --test-dir build-asan-${{ matrix.cxx_standard }} --build-config RelWithDebInfo --output-on-failure

  codecov:
    name: Codecov / Ubuntu / C++20
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/build-codecov/_deps
          key: cmake-deps-codecov-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}
          restore-keys: |
            cmake-deps-codecov-${{ runner.os }}-
            cmake-deps-${{ runner.os }}-

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build-codecov
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DCLASSIFY_SCALAR_BUILD_TESTS=ON
          -DCLASSIFY_SCALAR_BUILD_CATCH2_TESTS=ON
          -DCLASSIFY_SCALAR_ENABLE_COVERAGE=ON
          -DCLASSIFY_SCALAR_TEST_CXX_STANDARD=20

      - name: Build
        run: cmake --build build-codecov --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-codecov --build-config Debug --output-on-failure

      - name: Generate lcov report
        run: |
          lcov \
            --capture \
            --directory build-codecov/tests \
            --rc geninfo_unexecuted_blocks=1 \
            --ignore-errors source \
            --output-file coverage.raw.info
          lcov \
            --extract coverage.raw.info \
            '*/include/classify_scalar.hpp' \
            --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage.info
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
